name: zt-lab
# 미니 Zero Trust 랩 — 그림 7-2의 4계층을 내 PC 하나에 올린다
#   ② 인증·권한관리: keycloak(IdP) + opa(PDP)
#   ③ 컨트롤      : pep(접근 게이트웨이)
#   ④ 위험 탐지    : detector(로그 분석 → 위험 점수를 OPA에 반영)
#   보호 대상      : erp(온프레미스 업무시스템 역할), aichat(AI 서비스 역할)
#
# 요청 흐름: 사용자 ─토큰 발급─▶ keycloak
#           사용자 ─요청+토큰─▶ pep ─"허용해도 되나?"─▶ opa ─결정─▶ pep ─(허용일 때만)─▶ erp/aichat
#           pep가 남긴 접근 로그 ─▶ detector ─위험 점수─▶ opa (다음 판단에 반영)
# 실행: docker compose up -d --build
services:
  keycloak:                       # IdP: 사용자를 확인하고 서명된 토큰(JWT)을 발급한다
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm   # 개발 모드로 시작하면서 keycloak/ 폴더의 realm(사용자·역할) 설정을 불러온다
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin   # 실습용 관리자 계정 (운영에서는 절대 이렇게 두지 않는다)
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080   # 토큰의 발급자(iss)에 찍히는 주소 → pep의 ISSUER와 같아야 한다
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # 컨테이너끼리는 keycloak:8080으로도 접속할 수 있게 허용
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
    networks: [front]

  opa:                            # PDP(정책 결정 지점): policy/zt.rego 규칙으로 허용·차단을 판단한다
    image: openpolicyagent/opa:1.0.0
    command: run --server --addr=0.0.0.0:8181 --log-level=error /policy
    volumes:
      - ./policy:/policy:ro       # 정책 파일 폴더 (고친 뒤에는 docker compose restart opa로 다시 읽힌다)
    ports: ["8181:8181"]          # 실습 중 정책·위험 점수를 들여다보기 위해 열어 둔다
    networks: [front, back]

  pep:                            # PEP(정책 집행 지점): 모든 요청이 지나는 관문
    build: ./services
    command: uvicorn pep:app --host 0.0.0.0 --port 8000
    environment:
      ISSUER: http://localhost:8080/realms/zt   # 이 발급자가 서명한 토큰만 믿는다
      JWKS_URL: http://keycloak:8080/realms/zt/protocol/openid-connect/certs   # 토큰 서명 검증용 공개키 주소
      OPA_URL: http://opa:8181/v1/data/zt/decision   # zt.rego의 decision 규칙을 묻는 주소
    volumes:
      - ./logs:/logs              # 접근 로그(access.jsonl)를 detector와 함께 쓴다
      - ./devices.json:/app/devices.json:ro   # 등록 기기 목록 (MDM 역할)
    ports: ["8000:8000"]          # 사용자가 들어올 수 있는 유일한 입구
    networks: [front, back]

  erp:
    build: ./services
    command: uvicorn app:app --host 0.0.0.0 --port 9000
    environment: { APP_NAME: "ERP(온프레미스 업무시스템)" }
    networks: [back]              # ports 없음: PEP를 거치지 않고는 닿을 수 없다

  aichat:
    build: ./services
    command: uvicorn app:app --host 0.0.0.0 --port 9000
    environment: { APP_NAME: "사내 AI 챗봇" }
    networks: [back]              # erp와 같이 내부망에만 있다

  detector:                       # 위험 탐지: 접근 로그를 보고 사용자별 위험 점수를 OPA에 넣는다
    build: ./services
    command: python -u detector.py   # -u: 출력을 바로 보여 준다 (docker compose logs -f detector로 확인)
    environment:
      OPA_DATA: http://opa:8181/v1/data/risk   # zt.rego가 읽는 data.risk 위치
    volumes:
      - ./logs:/logs
    networks: [back]

networks:
  front: {}                       # 사용자(내 PC)가 닿을 수 있는 네트워크
  back: { internal: true }        # 외부와 단절된 내부망

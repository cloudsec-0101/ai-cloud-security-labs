# 앞단 프록시: 외부 요청은 이곳을 거쳐 서버 3대로 나뉜다 (9장 실습 4)
# Workaround(임시 조치)는 서버를 고치지 않고, 이 앞단에서 공격 경로만 막는 방법이다.
# 패치가 끝날 때까지 시간을 벌어 주지만 취약점 자체는 남아 있으므로, 반드시 기한을 두고 해제한다.

# 요청을 나눠 줄 서버 묶음 (기본은 차례대로 돌아가며 보내는 라운드 로빈)
upstream app {
    server app1:8000;
    server app2:8000;
    server app3:8000;
}
server {
    listen 80;
    # patch_cycle.py workaround on이 이 파일에 차단 규칙을 쓰고, off가 다시 비운다
    include /etc/nginx/workaround.conf;   # Workaround 규칙이 들어가는 자리 (평소에는 비어 있음)
    location / {
        proxy_pass http://app;            # 나머지 요청은 모두 서버 묶음으로 전달
    }
}
